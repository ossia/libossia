name: Documentation

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq doxygen doxygen-doc doxygen-gui graphviz
      - name: Build Documentation
        run: |
          cd docs/Doxygen
          doxygen > doxygen.log
          mkdir -p publish
          mv html publish
          # This branch is served at ossia.io/libossia/ and shadows that path on
          # the main website: send visitors of the root to the libossia page.
          cat > publish/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>libossia</title>
            <link rel="canonical" href="https://ossia.io/site-libossia/about.html">
            <meta http-equiv="refresh" content="0; url=https://ossia.io/site-libossia/about.html">
          </head>
          <body>
            <p>Redirecting to <a href="https://ossia.io/site-libossia/about.html">libossia</a>.
               See also the <a href="html/">libossia API documentation</a>.</p>
          </body>
          </html>
          EOF
      - name: Deploy Documentation
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/Doxygen/publish
          commit_message: 'Deploy code docs to GitHub Pages, Github Action id: $GITHUB_ACTION \nCommit: $GITHUB_SHA'
          force_orphan: true
